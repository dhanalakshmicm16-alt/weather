<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weather App</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <main class="container">
    <div class="topbar">
      <a class="back" href="index.html">&larr; Home</a>
      <h1>🌤️ Weather App</h1>
      <a class="back" href="movies.html">Movies &rarr;</a>
    </div>

    <form id="search-form" class="search-form" autocomplete="off">
      <input type="text" id="city-input" placeholder="Search a city, e.g. Bengaluru" aria-label="City name" required />
      <button type="submit" id="search-btn">Search</button>
    </form>

    <section id="result" aria-live="polite">
      <div class="message info">Enter a city name to see the current weather.</div>
    </section>
  </main>

  <script type="module" src="js/weather.js"></script>
</body>
</html>
